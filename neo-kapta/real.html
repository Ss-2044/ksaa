<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800;900&family=Cairo:wght@800;900&family=Almarai:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111}
.wrap{position:relative;display:inline-block;margin:10px;overflow:hidden}
canvas{display:block}
.q{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;align-items:center;overflow:hidden}
.q .t{flex:1;text-align:center;font-weight:900;line-height:1.3;white-space:nowrap}
.logo{display:flex;align-items:center;justify-content:center}
.logo i{display:block;background:url(logo-src.jpg) no-repeat;mix-blend-mode:screen}
.fx{position:absolute;inset:0;pointer-events:none}
</style></head><body><div id="out"></div>
<script>
// homography: map rect w x h to quad [[x0,y0],[x1,y1],[x2,y2],[x3,y3]] (TL,TR,BR,BL)
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];
for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}
const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}return x}
function m3d(w,h,q){const src=[[0,0],[w,0],[w,h],[0,h]];const A=[],b=[];
for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=q[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}
const[a,bb,c,d,e,f,g,hh]=solve(A,b);return `matrix3d(${a},${d},0,${g},${bb},${e},0,${hh},0,0,1,0,${c},${f},0,1)`}
const logoI=(w,h)=>{const s=w/240;return `<i style="width:${w}px;height:${h}px;background-size:${480*s}px ${480*s}px;background-position:${-121*s}px ${-153*s}px"></i>`};
const P=[
 {img:'p1.webp',wm:[680,1192,250,68],dx:-260,dy:0,quads:[
   {q:[[6,712],[937,660],[937,780],[6,820]],w:1860,h:220,html:`<div class="logo" style="width:330px;height:100%">${logoI(300,200)}</div><div class="t"><div style="font-family:Cairo;font-size:76px;color:#fff">الحين وأنت تقرأ هاللوحة…</div><div style="font-family:Cairo;font-size:104px;line-height:1.1;color:#fff">منافسك يبيع</div></div>`,
    style:'background:linear-gradient(90deg,#2b3cb0,#4458d6)',fx:'background:radial-gradient(ellipse 30% 90% at 15% 0%,rgba(255,230,190,.35),transparent 70%),radial-gradient(ellipse 30% 90% at 45% 0%,rgba(255,230,190,.3),transparent 70%),radial-gradient(ellipse 30% 90% at 80% 0%,rgba(255,230,190,.3),transparent 70%)'}]},
 {img:'p2.webp',wm:[740,1236,275,66],dx:-300,dy:0,quads:[
   {q:[[62,574],[893,586],[893,857],[62,690]],w:1600,h:300,html:`<div class="t"><div style="font-size:78px;color:#fff">المنافس مو أشطر منك…</div><div style="font-size:112px;color:#fff">بس أحد يسوّق له</div></div><div class="logo" style="width:300px;height:100%;border-right:8px solid #ddd">${logoI(270,180)}</div>`,
    style:'background:#0a0a0a',txtfx:'text-shadow:0 0 18px rgba(255,255,255,.55)'},
   {q:[[897,578],[1022,574],[1022,862],[897,864]],w:300,h:520,html:`<div class="logo" style="width:100%;height:100%">${logoI(280,190)}</div>`,style:'background:#0d0d0d'}]},
 {img:'p3.webp',wm:[740,1256,280,66],dx:-300,dy:0,quads:[
   {q:[[0,994],[882,994],[882,1182],[0,1184]],w:1500,h:320,html:`<div class="t"><div style="font-family:Almarai;font-size:92px;color:#eee9e1">صورتها؟ شكراً… سويت لنا إعلان ببلاش</div></div>`,style:'background:linear-gradient(100deg,#2e2c2d,#3d3a38 60%,#2a2b30)'},
   {q:[[906,994],[1020,994],[1020,1180],[906,1180]],w:200,h:326,html:`<div class="logo" style="width:100%;height:100%">${logoI(190,130)}</div>`,style:'background:#15171c'}]},
 {img:'p4.webp',crop:1045,quads:[
   {q:[[348,588],[946,584],[946,754],[348,754]],w:1100,h:312,html:`<div class="t"><div style="font-family:Cairo;font-size:66px;color:#efe8dc">آخر مرة أحد سأل عن براندك…</div><div style="font-family:Cairo;font-size:96px;color:#6f7fe6">متى؟</div></div><div class="logo" style="width:230px;height:100%">${logoI(210,140)}</div>`,style:'background:#1c1d21'}]},
 {img:'p5.webp',wm:[750,922,284,58],dx:-300,dy:0,quads:[
   {q:[[0,533],[813,537],[813,708],[0,704]],w:1240,h:260,html:`<div class="t"><div style="font-size:66px;color:#1b2a6b">لا تلوم الزباين..</div><div style="font-size:112px;color:#1b2a6b">هم ما شافوك أصلاً</div></div><div style="position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(90deg,#2a9bb0,#3f51c9);clip-path:polygon(0 60%,30% 20%,60% 70%,100% 10%,100% 100%,0 100%)"></div>`,style:'background:#f4f6fa;position:absolute'},
   {q:[[843,537],[962,537],[962,708],[843,708]],w:200,h:288,html:`<div class="logo" style="width:100%;height:100%">${logoI(190,130)}</div>`,style:'background:#0c0d12'}]},
];
(async()=>{
 await document.fonts.ready;
 for(let i=0;i<P.length;i++){const p=P[i];const im=new Image();im.src=p.img;await im.decode();
  const W=im.naturalWidth,H=im.naturalHeight;
  const wrap=document.createElement('div');wrap.className='wrap';wrap.id='r'+(i+1);wrap.style.width=W+'px';wrap.style.height=(p.crop||H)+'px';
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0);
  // hide watermark: clone patch from just above with feathered mask
  if(p.wm){const[wx,wy,ww,wh]=p.wm;const dx=p.dx??0,dy=p.dy??-(wh+20);
  const t=document.createElement('canvas');t.width=ww+40;t.height=wh+40;const tx=t.getContext('2d');
  tx.drawImage(im,wx-20+dx,wy-20+dy,ww+40,wh+40,0,0,ww+40,wh+40);
  tx.globalCompositeOperation='destination-in';const g=tx.createRadialGradient((ww+40)/2,(wh+40)/2,Math.min(ww,wh)/2,(ww+40)/2,(wh+40)/2,(ww+40)/2);
  tx.fillStyle='#000';tx.filter='blur(6px)';tx.fillRect(14,14,ww+12,wh+12);
  x.drawImage(t,wx-20,wy-20);}
  wrap.appendChild(c);
  for(const b of p.quads){const d=document.createElement('div');d.className='q';d.style.cssText+=`width:${b.w}px;height:${b.h}px;${b.style};transform:${m3d(b.w,b.h,b.q)};filter:blur(.6px)`;
   d.innerHTML=b.html+(b.fx?`<div class="fx" style="${b.fx}"></div>`:'');if(b.txtfx)d.querySelectorAll('.t').forEach(e=>e.style.cssText+=b.txtfx);wrap.appendChild(d);}
  document.getElementById('out').appendChild(wrap);}
 document.body.dataset.ready=1;
})();
</script></body></html>

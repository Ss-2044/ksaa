<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Noto+Naskh+Arabic:wght@700&family=Alexandria:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#120b05;overflow:hidden}
.p{position:relative;width:1080px;height:1350px;overflow:hidden}
.photo{position:absolute;left:-60px;top:-260px;width:1200px;height:1557px;object-fit:cover;filter:sepia(.55) saturate(1.3) contrast(1.15) brightness(.95) hue-rotate(-8deg)}
.l{position:absolute;inset:0}
.warm{background:linear-gradient(160deg,rgba(255,150,40,.18),rgba(0,0,0,0) 50%);mix-blend-mode:screen}
.bot{background:linear-gradient(to top,#120b05 0%,#120b05 30%,rgba(18,11,5,.75) 42%,transparent 58%)}
.top{background:linear-gradient(to bottom,rgba(18,11,5,.8),transparent 16%)}
.neo{position:absolute;top:38px;left:42px;height:100px;z-index:5;filter:brightness(1.3) drop-shadow(0 0 12px #000)}
.frame{position:absolute;inset:26px;border:1.5px solid rgba(230,170,90,.45);z-index:4;pointer-events:none}
.title{position:absolute;top:780px;left:0;right:0;text-align:center;z-index:5;font-family:'Reem Kufi';font-size:120px;line-height:1;color:#f3b45a;letter-spacing:2px;
 text-shadow:0 0 40px rgba(243,140,40,.45)}
.poem{position:absolute;top:935px;left:0;right:0;text-align:center;z-index:5;font-family:'Noto Naskh Arabic';font-weight:700;color:#f6ead8;font-size:40px;line-height:1.75}
.poem .s{color:#e6a24e;font-size:28px;display:block;line-height:1;margin:6px 0 10px}
.foot{position:absolute;bottom:52px;left:0;right:0;text-align:center;z-index:5;font-family:Alexandria;font-size:19px;letter-spacing:6px;color:#b98a52;direction:ltr}
</style></head><body><div class="p">
<img class="photo" src="pilot.jpg"><div class="l warm"></div><div class="l top"></div><div class="l bot"></div>
<div class="frame"></div><img class="neo" src="neo_logo.png">
<div class="title">بنات الريح</div>
<div class="poem">على بنات الريح ما ادري خواته<br>جوكم شغاميم العيال الأواليد<span class="s">✦</span>صقور المنايا يا مدوّر مماته<br>حيّ الصقور اللي ليا هدّت تصيد</div>
<div class="foot">ROYAL SAUDI AIR FORCE</div>
</div></body></html>

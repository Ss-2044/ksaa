<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Aref+Ruqaa:wght@700&family=Amiri:wght@700&family=Alexandria:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#8fa6c8;overflow:hidden}
.p{position:relative;width:1080px;height:1350px;overflow:hidden}
.photo{position:absolute;left:0;top:0;width:1080px;height:1350px;object-fit:cover;object-position:50% 50%;filter:contrast(1.08) saturate(1.1)}
.l{position:absolute;inset:0}
.top{background:linear-gradient(to bottom,rgba(12,28,58,.88) 0%,rgba(20,40,80,.55) 22%,transparent 38%)}
.bot{background:linear-gradient(to top,rgba(10,18,32,.92) 0%,rgba(10,18,32,.55) 22%,transparent 40%)}
.neo{position:absolute;top:40px;left:44px;height:100px;z-index:5;filter:brightness(1.3) drop-shadow(0 0 10px rgba(0,0,0,.8))}
.title{position:absolute;top:95px;left:0;right:0;text-align:center;z-index:5;font-family:'Aref Ruqaa';font-weight:700;font-size:138px;color:#fff;text-shadow:0 6px 30px rgba(0,20,60,.7)}
.sub{position:absolute;top:350px;left:0;right:0;text-align:center;z-index:5;font-family:Alexandria;font-weight:500;font-size:22px;letter-spacing:4px;color:#d8e4f5}
.poem{position:absolute;bottom:110px;left:0;right:0;z-index:5;font-family:'Aref Ruqaa';font-weight:700;color:#fff;font-size:46px;text-shadow:0 2px 12px #000}
.v{display:flex;justify-content:center;gap:28px;margin-bottom:18px}
.v i{font-style:normal;color:#ffd23f}
.foot{position:absolute;bottom:44px;left:0;right:0;text-align:center;z-index:5;font-family:Alexandria;font-weight:700;font-size:20px;color:#ffd23f;letter-spacing:1px}
</style></head><body><div class="p">
<img class="photo" src="f15.jpg"><div class="l top"></div><div class="l bot"></div>
<img class="neo" src="neo_logo.png">

<div class="poem">
<div class="v"><span>على بنات الريح ما ادري خواته</span><i>◆</i><span>جوكم شغاميم العيال الأواليد</span></div>
<div class="v"><span>صقور المنايا يا مدوّر مماته</span><i>◆</i><span>حيّ الصقور اللي ليا هدّت تصيد</span></div>
</div>
<div class="foot">ترحيب يليق بالصقور</div>
</div></body></html>

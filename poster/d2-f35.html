<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Amiri:wght@700&family=Alexandria:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#04140c;overflow:hidden}
.p{position:relative;width:1080px;height:1350px;overflow:hidden;background:radial-gradient(ellipse 90% 50% at 50% 20%,#0b3a22,#04140c 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(80,220,140,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(80,220,140,.06) 1px,transparent 1px);background-size:54px 54px;
 -webkit-mask:linear-gradient(to bottom,#000 0%,transparent 55%)}
.ph{position:absolute;left:0;bottom:0;width:1080px;height:780px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;filter:contrast(1.1) saturate(.9)}
.ph::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,#04140c 0%,rgba(4,20,12,.4) 18%,transparent 35%,transparent 80%,rgba(4,20,12,.7) 100%)}
.neo{position:absolute;top:40px;left:44px;height:100px;z-index:5;filter:brightness(1.3) drop-shadow(0 0 10px #000)}
.tag{position:absolute;top:56px;right:48px;z-index:5;font-family:Alexandria;font-weight:700;font-size:20px;color:#5fe39a;border:1.5px solid #5fe39a;padding:8px 18px;border-radius:40px}
.title{position:absolute;top:150px;right:80px;z-index:5;font-family:Lalezar;font-size:150px;line-height:1;color:#fff}
.title span{color:#1fd16f}
.bar{position:absolute;top:318px;right:84px;width:140px;height:6px;background:#1fd16f;z-index:5}
.poem{position:absolute;top:360px;right:84px;z-index:5;font-family:Amiri;font-weight:700;font-size:42px;line-height:1.6;color:#e9f5ee;text-align:right}
.poem b{color:#7cf0ad;font-weight:700}
.foot{position:absolute;bottom:40px;left:0;right:0;text-align:center;z-index:5;font-family:Alexandria;font-weight:700;font-size:22px;color:#fff;text-shadow:0 2px 10px #000}
</style></head><body><div class="p"><div class="grid"></div>
<div class="ph"><img src="f35c.jpg"></div>
<img class="neo" src="neo_logo.png"><div class="tag">القوات الجوية الملكية السعودية</div>
<div class="title">بنات <span>الريح</span></div><div class="bar"></div>
<div class="poem">على <b>بنات الريح</b> ما ادري خواته<br>جوكم شغاميم العيال الأواليد<br><b>صقور المنايا</b> يا مدوّر مماته<br>حيّ الصقور اللي ليا هدّت تصيد</div>
<div class="foot">اللهم احفظ جنودنا وسدّد رميهم 🇸🇦</div>
</div></body></html>

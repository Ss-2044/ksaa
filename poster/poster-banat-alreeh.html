<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@700&family=Alexandria:wght@500;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:#0b1620;overflow:hidden}
.p{position:relative;width:1080px;height:1350px;overflow:hidden}
.photo{position:absolute;left:0;top:50px;width:1080px;height:1401px;object-fit:cover;filter:contrast(1.08) saturate(1.05)}
.l{position:absolute;inset:0;pointer-events:none}
.sky{background:linear-gradient(to bottom,rgba(6,14,22,.92) 0%,rgba(10,24,36,.72) 22%,rgba(10,24,36,.25) 38%,transparent 46%)}
.bot{background:linear-gradient(to top,rgba(5,10,14,.9) 0%,rgba(5,10,14,.35) 12%,transparent 22%)}
.vign{background:radial-gradient(ellipse 85% 80% at 50% 55%,transparent 60%,rgba(0,0,0,.55))}
.sun{background:radial-gradient(ellipse 40% 22% at 42% 52%,rgba(255,180,90,.18),transparent 70%);mix-blend-mode:screen}
.neo{position:absolute;top:40px;left:44px;height:104px;z-index:5;filter:brightness(1.25) drop-shadow(0 0 12px rgba(0,0,0,.9))}
.tag{position:absolute;top:58px;right:48px;z-index:5;text-align:right;font-family:Alexandria;color:#d9c6a0}
.tag b{display:block;font-weight:700;font-size:21px;letter-spacing:.5px}
.tag span{display:block;font-weight:500;font-size:15px;color:#9fb3c2;letter-spacing:3px;direction:ltr;margin-top:4px}
.title{position:absolute;top:150px;left:0;right:0;text-align:center;z-index:5;font-family:'Aref Ruqaa';font-weight:700;font-size:128px;line-height:1.2;
 background:linear-gradient(180deg,#fff6e2 10%,#e8c27a 55%,#b9883e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 4px 18px rgba(0,0,0,.7))}
.orn{position:absolute;top:322px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;z-index:5}
.orn i{display:block;width:170px;height:1.5px;background:linear-gradient(90deg,transparent,#d9b56e)}
.orn i:last-child{background:linear-gradient(270deg,transparent,#d9b56e)}
.orn em{width:10px;height:10px;transform:rotate(45deg);border:1.5px solid #d9b56e}
.poem{position:absolute;top:366px;left:60px;right:60px;z-index:5;font-family:Amiri;font-weight:700;color:#f4efe4;font-size:41px;
 text-shadow:0 2px 14px rgba(0,0,0,.85)}
.v{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;margin-bottom:22px}
.v span{text-align:center;white-space:nowrap}
.v .dot{justify-self:center;width:7px;height:7px;border-radius:50%;background:#d9b56e;box-shadow:0 0 10px #d9b56e}
.foot{position:absolute;left:0;right:0;bottom:40px;text-align:center;z-index:5;font-family:Alexandria;font-weight:500;color:#cfd8df;font-size:22px;letter-spacing:1px}
.foot b{color:#e8c27a;font-weight:700}
</style></head><body><div class="p">
<img class="photo" src="pilot.jpg">
<div class="l sun"></div><div class="l sky"></div><div class="l bot"></div><div class="l vign"></div>
<img class="neo" src="neo_logo.png">
<div class="tag"><b>صقور المنايا</b><span>RSAF</span></div>
<div class="title">بنات الريح</div>
<div class="orn"><i></i><em></em><i></i></div>
<div class="poem">
 <div class="v"><span>على بنات الريح ما ادري خواته</span><b class="dot"></b><span>جوكم شغاميم العيال الأواليد</span></div>
 <div class="v"><span>صقور المنايا يا مدوّر مماته</span><b class="dot"></b><span>حيّ الصقور اللي ليا هدّت تصيد</span></div>
</div>
<div class="foot"><b>القوات الجوية الملكية السعودية</b> · فخرٌ يحلّق في السماء</div>
</div></body></html>
